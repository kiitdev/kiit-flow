<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kiit banner</title>
<!--
  Kiit banner template (1280x320). Edit CONFIG below, then either:
    1. open this file in a browser and press "Download SVG", or
    2. export from the command line: ./banner.sh banner.html kiit-flow-banner.svg
-->
<style>
  body { margin: 0; padding: 24px; background: #eef2f8; color: #1f2937; font: 14px system-ui, sans-serif; }
  #banner svg { width: 100%; max-width: 1280px; height: auto; display: block; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
  pre#svg { display: none; }
</style>
<body>
<div id="banner"></div>
<button id="dl">Download SVG</button>
<pre id="svg"></pre>

<script src="kiit-svg.js"></script>
<script>
// ---- CONFIG: change these for each project ---------------------------------
const CONFIG = {
  brand: "kiit",                  // blue
  name: "flow",                   // black, joined to the brand with a hyphen
  slant: -0.6,                    // lean of the sweep: -0.6 leans like /, 0.6 like \, 0 is upright
  tagline: "A fast, flow, or focus based skills framework for coding with AI",
  steps: { join: "→" },           // between the steps. Try ">" too
  tiers: [                        // the bottom row, one box each. style: fast, flow, or heavy
    { style: "fast", words: ["go"] },
    { style: "flow", before: "or", words: ["begin", "design", "update", "verify"] },
    { style: "heavy", prefix: "+", words: ["research", "review", "revise"] },
  ],
  card: {
    title: "260928-kiit-codes-fix-1234",
    left: "stage",
    right: "status",
    rows: [                       // [number, text, status]: done, todo, blocked or skip
      ["1.", "begin", "done"],
      ["2.", "design", "done"],
      ["3.", "review", "done"],
      ["4.", "revise", "skip"],
      ["5.", "update", "todo"],
      ["6.", "verify", "todo"],
    ],
    footer: "",                   // optional line under the card
  },
  theme: KIIT_THEME,
};
// ---------------------------------------------------------------------------

function buildSvg(c) {
  const t = c.theme;
  const full = c.brand + "-" + c.name;
  const n = full.length;
  // shrink long names so the title and arrow stay left of the card (x < 760)
  const titleSize = Math.min(104, Math.floor((664 + 3 * n) / (0.6 * n + 0.62)));
  const advance = 0.6 * titleSize - 3;                        // the step from one letter to the next
  const titleWidth = Math.round(n * advance);
  // every letter gets its own x, so no font can push the word under the arrow
  const letterXs = Array.from({ length: n }, (_, i) => (84 + i * advance).toFixed(1)).join(" ");
  const aw = Math.round(0.62 * titleSize);        // arrow width
  const head = Math.round(0.34 * titleSize);      // length of the pointed head
  const half = Math.round(0.2 * titleSize);       // half the height of the head
  const shaft = Math.round(0.11 * titleSize) / 2; // half the thickness of the shaft
  const ax = 84 + titleWidth + 14;
  const ay = 166 - Math.round(0.3 * titleSize);   // vertical middle of the lowercase letters
  const arrowPath = `M ${ax} ${ay - shaft} H ${ax + aw - head} V ${ay - half} L ${ax + aw} ${ay} L ${ax + aw - head} ${ay + half} V ${ay + shaft} H ${ax} Z`;
  const tagSize = Math.min(20, Math.floor(650 / (0.6 * c.tagline.length)));
  const rows = c.card.rows;
  const h = 98 + 24 * rows.length;
  const top = (320 - h) / 2;

  const rowSvg = rows.map(([num, text, st], i) => {
    const y = 104 + 24 * i;
    return `      <text x="24" y="${y}" font-size="16" fill="${t.ink}"><tspan fill="${t.dim}">${esc(num)} </tspan>${esc(text)}</text>
      <text x="404" y="${y}" font-size="16" fill="${t[st] || t.dim}" text-anchor="end">${esc(st)}</text>`;
  }).join("\n");

  // the bottom row: a box per tier. Every character gets its own x, so no font can spill out of its box
  const boxY = 234, boxH = 38, textY = boxY + 25, rowStart = 88, rowEnd = 745;
  const tiersAt = (sz) => {
    const cw = sz * 0.6;
    let x = rowStart;
    const items = c.tiers.map((tier, i) => {
      if (i > 0) x += 12;
      const item = { tier, cw };
      if (tier.before) { item.beforeX = x; x += tier.before.length * cw + 12; }
      item.str = (tier.prefix ? tier.prefix + " " : "") + tier.words.join(` ${c.steps.join} `);
      item.x = x;
      item.w = Math.round(item.str.length * cw + 32);
      x += item.w;
      return item;
    });
    return { items, end: x };
  };
  let sz = 16, lay = tiersAt(sz);
  if (lay.end > rowEnd) { sz = Math.floor(16 * (rowEnd - rowStart) / (lay.end - rowStart)); lay = tiersAt(sz); }
  const arrow = `<tspan fill="${t.ink}" stroke="${t.ink}" stroke-width="1"> ${esc(c.steps.join)} </tspan>`;
  const tierSvg = lay.items.map(({ tier, cw, str, x, w, beforeX }) => {
    const color = t[tier.style], tint = t[tier.style + "Tint"], border = t[tier.style + "Border"];
    const xs = Array.from(str, (_, j) => (x + 16 + j * cw).toFixed(1)).join(" ");
    const before = tier.before ? `<text x="${beforeX}" y="${textY}" font-size="${sz}" fill="${t.dim}">${esc(tier.before)}</text>\n    ` : "";
    return `${before}<rect x="${x}" y="${boxY}" width="${w}" height="${boxH}" rx="10" fill="${tint}" stroke="${border}" stroke-width="2"/>
    <text x="${xs}" y="${textY}" font-size="${sz}" font-weight="700" fill="${color}">${tier.prefix ? esc(tier.prefix) + " " : ""}${tier.words.map(esc).join(arrow)}</text>`;
  }).join("\n    ");
  const footer = c.card.footer
    ? `\n    <text x="1200" y="${top + h + 26}" font-size="14" fill="${t.dim}" text-anchor="end">${esc(c.card.footer)}</text>`
    : "";

  const f = t.frameWidth, o = f / 2, r = 20 - o;          // outline inset and corner radius
  const leftEdge = `M 20 ${o} A ${r} ${r} 0 0 0 ${o} 20 V ${320 - 20} A ${r} ${r} 0 0 0 20 ${320 - o}`;
  const rest = `M 20 ${o} H ${1280 - 20} A ${r} ${r} 0 0 1 ${1280 - o} 20 V ${320 - 20} A ${r} ${r} 0 0 1 ${1280 - 20} ${320 - o} H 20`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="${esc(full)} — ${esc(c.tagline)}">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="${t.grid}" stroke-width="1"/>
    </pattern>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="${ax - aw}" y1="0" x2="${ax}" y2="0" gradientTransform="matrix(1 0 ${c.slant} 1 ${-c.slant * ay} 0)">
      <stop offset="0" stop-color="${t.blue}"/>
      <stop offset="0.3" stop-color="${t.blue}"/>
      <stop offset="0.5" stop-color="${t.sheen}"/>
      <stop offset="0.7" stop-color="${t.blue}"/>
      <stop offset="1" stop-color="${t.blue}"/>
      <animateTransform attributeName="gradientTransform" type="translate" additive="sum" values="0 0;0 0;${2 * aw} 0;${2 * aw} 0" keyTimes="0;0.15;0.75;1" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="${t.paper}"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
  </g>
  <path d="${rest}" fill="none" stroke="${t.frame}" stroke-width="${f}"/>
  <path d="${leftEdge}" fill="none" stroke="${t.frameLeft}" stroke-width="${f}"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="${letterXs}" y="166" font-size="${titleSize}" font-weight="700" fill="${t.ink}"><tspan fill="${t.blue}">${esc(c.brand)}</tspan>-${esc(c.name)}</text>
    <path d="${arrowPath}" fill="url(#sheen)"/>
    <text x="88" y="218" font-size="${tagSize}" fill="${t.sub}">${esc(c.tagline)}</text>
    ${tierSvg}

    <g transform="translate(772 ${top})">
      <rect width="428" height="${h}" rx="12" fill="${t.card}" stroke="${t.border}"/>
      <text x="24" y="34" font-size="14" font-weight="700" fill="${t.blue}">${esc(c.card.title)}</text>
      <line x1="24" y1="48" x2="404" y2="48" stroke="${t.border}"/>
      <text x="24" y="70" font-size="14" fill="${t.dim}">${esc(c.card.left)}</text>
      <text x="404" y="70" font-size="14" fill="${t.dim}" text-anchor="end">${esc(c.card.right)}</text>
      <line x1="24" y1="80" x2="404" y2="80" stroke="${t.rule}" stroke-dasharray="3 4"/>
${rowSvg}
    </g>${footer}
  </g>
</svg>
`;
}

const svgText = buildSvg(CONFIG);
document.getElementById("banner").innerHTML = svgText;
document.getElementById("svg").textContent = svgText;   // read by banner.sh
document.getElementById("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml" }));
  a.download = CONFIG.brand + "-" + CONFIG.name + "-banner.svg";
  a.click();
};
</script>
