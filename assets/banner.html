<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kiit banner</title>
<!--
  Kiit banner template (1280x320). Edit CONFIG below, then either:
    1. open this file in a browser and press "Download SVG", or
    2. export from the command line: ./banner.sh banner.html kiit-flow-banner.svg
-->
<style>
  body { margin: 0; padding: 24px; background: #eef2f8; color: #1f2937; font: 14px system-ui, sans-serif; }
  #banner svg { width: 100%; max-width: 1280px; height: auto; display: block; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
  pre#svg { display: none; }
</style>
<body>
<div id="banner"></div>
<button id="dl">Download SVG</button>
<pre id="svg"></pre>

<script>
// ---- CONFIG: change these for each project ---------------------------------
const CONFIG = {
  brand: "kiit",                  // blue
  name: "flow",                   // black, joined to the brand with a hyphen
  tagline: "A fast or structured multi-project skills framework",
  steps: {
    lead: "go",                   // the fast path. Leave empty to omit
    items: ["begin", "design", "review", "revise", "update", "verify"],
  },
  card: {
    title: "260928-kiit-codes-fix-1234",
    left: "stage",
    right: "status",
    rows: [                       // [number, text, status]: done, todo, blocked or skip
      ["1.", "begin", "done"],
      ["2.", "design", "done"],
      ["3.", "review", "done"],
      ["4.", "revise", "skip"],
      ["5.", "update", "todo"],
      ["6.", "verify", "todo"],
    ],
    footer: "",                   // optional line under the card
  },
  theme: {
    paper: "#FFFFFF", grid: "#D6E2F5", frame: "#C9D8F0",
    blue: "#007FFF",              // blueprint blue
    ink: "#111827", sub: "#4B5563", dim: "#6B7A99",
    highlight: "#D9480F",         // the steps line
    card: "#F4F8FD", border: "#9DB6DE", rule: "#C9D8F0",
    done: "#1B8A5A", todo: "#C26A00", blocked: "#C0392B", skip: "#8A94A8",
  },
};
// ---------------------------------------------------------------------------

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function buildSvg(c) {
  const t = c.theme;
  const full = c.brand + "-" + c.name;
  const n = full.length;
  // shrink long names so the title and cursor stay left of the card (x < 740)
  const titleSize = Math.min(104, Math.floor((656 + 3 * n) / (0.6 * (n + 1))));
  const tagSize = Math.min(20, Math.floor(650 / (0.6 * c.tagline.length)));
  const rows = c.card.rows;
  const h = 98 + 24 * rows.length;
  const top = (320 - h) / 2;

  const rowSvg = rows.map(([num, text, st], i) => {
    const y = 104 + 24 * i;
    return `      <text x="24" y="${y}" font-size="16" fill="${t.ink}"><tspan fill="${t.dim}">${esc(num)} </tspan>${esc(text)}</text>
      <text x="404" y="${y}" font-size="16" fill="${t[st] || t.dim}" text-anchor="end">${esc(st)}</text>`;
  }).join("\n");

  const lead = c.steps.lead
    ? `<tspan>${esc(c.steps.lead)}</tspan><tspan fill="${t.dim}" font-weight="400"> | </tspan>`
    : "";
  const steps = lead + esc(c.steps.items.join(" → "));
  const footer = c.card.footer
    ? `\n    <text x="1200" y="${top + h + 26}" font-size="14" fill="${t.dim}" text-anchor="end">${esc(c.card.footer)}</text>`
    : "";

  return `<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="${esc(full)} — ${esc(c.tagline)}">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="${t.grid}" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="${t.paper}"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect x="0" y="0" width="8" height="320" fill="${t.blue}"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="none" stroke="${t.frame}"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="84" y="166" font-size="${titleSize}" font-weight="700" fill="${t.ink}" letter-spacing="-3"><tspan fill="${t.blue}">${esc(c.brand)}</tspan>-${esc(c.name)}<tspan fill="${t.blue}">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text x="88" y="218" font-size="${tagSize}" fill="${t.sub}">${esc(c.tagline)}</text>
    <text x="88" y="264" font-size="18" font-weight="700" fill="${t.highlight}">${steps}</text>

    <g transform="translate(772 ${top})">
      <rect width="428" height="${h}" rx="12" fill="${t.card}" stroke="${t.border}"/>
      <text x="24" y="34" font-size="14" font-weight="700" fill="${t.blue}">${esc(c.card.title)}</text>
      <line x1="24" y1="48" x2="404" y2="48" stroke="${t.border}"/>
      <text x="24" y="70" font-size="14" fill="${t.dim}">${esc(c.card.left)}</text>
      <text x="404" y="70" font-size="14" fill="${t.dim}" text-anchor="end">${esc(c.card.right)}</text>
      <line x1="24" y1="80" x2="404" y2="80" stroke="${t.rule}" stroke-dasharray="3 4"/>
${rowSvg}
    </g>${footer}
  </g>
</svg>
`;
}

const svgText = buildSvg(CONFIG);
document.getElementById("banner").innerHTML = svgText;
document.getElementById("svg").textContent = svgText;   // read by banner.sh
document.getElementById("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml" }));
  a.download = CONFIG.brand + "-" + CONFIG.name + "-banner.svg";
  a.click();
};
</script>
