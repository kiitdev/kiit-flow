<svg xmlns="http://www.w3.org/2000/svg" width="900" height="852" viewBox="0 0 900 852" role="img" aria-label="Why flow: Organized. Claude Code: A todo list in the session. kiit-flow: One work item per change, Criteria and a check per step, Reads the ticket and CLAUDE.md, Code is the truth, no spec. Saved. Claude Code: Transcript and --resume. kiit-flow: Markdown files per change, resume in any new session, Every run is logged, Blocked steps stop the run. Modes. Claude Code: Plan mode, and one loop for every task. kiit-flow: Fast, Flow, Focus, Risk moves a change up, Start small, move up as needed. Reviewed. Claude Code: Subagents, any model. kiit-flow: Plan review first in Focus, Another model can review, A verdict in 04-review.md, verify: lint, tests, security">
