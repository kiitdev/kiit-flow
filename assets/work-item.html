<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kiit work item card</title>
<!--
  Work item card template (about 1280 wide). Edit CONFIG below, then either:
    1. open this file in a browser and press "Download SVG", or
    2. export from the command line: ./banner.sh work-item.html kiit-flow-work-item.svg
-->
<style>
  body { margin: 0; padding: 24px; background: #eef2f8; color: #1f2937; font: 14px system-ui, sans-serif; }
  #banner svg { width: 100%; max-width: 1280px; height: auto; display: block; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
  pre#svg { display: none; }
</style>
<body>
<div id="banner"></div>
<button id="dl">Download SVG</button>
<pre id="svg"></pre>

<script src="kiit-svg.js"></script>
<script>
// ---- CONFIG: change these for each project ---------------------------------
const CONFIG = {
  label: "Work items",
  sub: "one folder per change, in the workspace",
  width: 1392,                               // the same width as the workflow diagram
  tree: [                                    // the workspace, one line per folder: [depth, name, kind]
    [0, "workspace/", "root"],
    [1, ".claude/", "plain"],
    [1, "_kiit/", "plain"],
    [2, "flow/", "plain"],
    [3, "260926-kiit-codes-docs-12/", "item"],
    [3, "260928-kiit-codes-fix-1234/", "open"],     // the work item shown below
    [3, "261002-kiit-result-feat-ts-port/", "item"],
    [1, "kiit-codes/", "project"],
    [1, "kiit-result/", "project"],
  ],
  notes: [                                   // a bracket beside rows from..to (row numbers in the tree)
    { from: 1, to: 1, label: "skills and kiit.json", color: "dim" },
    { from: 4, to: 6, label: "work item: one folder per change", color: "blue" },
    { from: 7, to: 8, label: "your projects", color: "sub" },
  ],
  parts: [                                   // the open folder's name, one part per segment of the format
    { text: "260928", label: "{YYMMDD}" },
    { text: "kiit-codes", label: "{project}" },
    { text: "fix", label: "{type}" },
    { text: "1234", label: "{ticket | short-name}" },
  ],
  groups: [
    {
      label: "stage files, written in order",
      files: [
        { name: "01-change.md", icon: "pencil", color: "#007FFF", purpose: "The change: requirements and acceptance criteria", by: ["begin", "go"] },
        { name: "02-design.md", icon: "square", color: "#7C4DFF", purpose: "The design: approach, files, how to test it", by: ["design", "revise"] },
        { name: "03-phases.md", icon: "steps", color: "#0FA3A3", purpose: "The plan: numbered phases and steps", by: ["design", "revise"] },
        { name: "04-review.md", icon: "magnifier", color: "#E8590C", purpose: "The latest review: stage, verdict, findings", by: ["review"] },
      ],
    },
    {
      label: "living files, updated as the work goes on",
      files: [
        { name: "_status.md", icon: "checklist", color: "#1B8A5A", purpose: "Where each step stands: todo, done, blocked, skip", by: ["design", "revise", "update", "resume"] },
        { name: "_history.md", icon: "clock", color: "#6B7A99", purpose: "Append-only log of what ran and when", by: ["every command"] },
        { name: "_research.md", icon: "compass", color: "#D6336C", purpose: "Dated entries: questions, findings, sources", by: ["research"] },
      ],
    },
  ],
  theme: KIIT_THEME,
};
// ---------------------------------------------------------------------------

function buildSvg(c) {
  const t = c.theme;
  // size the card to its content: the commands sit in one column right after the longest description
  const files = c.groups.flatMap((g) => g.files);
  const chipW = (cmd) => Math.round(cmd.length * 8.4 + 26);
  const chipsW = (f) => f.by.reduce((sum, cmd) => sum + chipW(cmd), 0) + 8 * (f.by.length - 1);
  const folder = c.parts.map((p) => p.text).join("-");
  const nameX = 114, purposeX0 = Math.round(nameX + Math.max(...files.map((f) => f.name.length)) * 11.4 + 36);
  const pillsX0 = Math.round(purposeX0 + Math.max(...files.map((f) => f.purpose.length)) * 9.6 + 36);
  const cardX = 48, cardRight0 = pillsX0 + Math.max(...files.map(chipsW)) + 24;
  const W = c.width || cardRight0 + 96;
  const cardRight = W - 48;
  const extra = Math.max(0, cardRight - cardRight0);       // spare width goes between the columns
  const purposeX = purposeX0 + Math.round(extra * 0.4), pillsX = pillsX0 + Math.round(extra * 0.8);
  const rowH = 56, labelH = 38, groupGap = 14, pad = 16;

  // the workspace tree: each folder on its own line, one level deeper than its parent
  const cw = 13.2, indent = 40, lineH = 34, openGap = 30, tx = 98, y0 = 140;   // character width at 22px, and the spacing
  const openAt = c.tree.findIndex(([, , kind]) => kind === "open");
  const lineY = (i) => y0 + i * lineH + (i > openAt ? openGap : 0);
  const treeBottom = lineY(c.tree.length - 1);
  const cardTop = treeBottom + 78, tabText = "inside " + folder;
  const tabW = Math.round(tabText.length * 8.4 + 40);      // the folder tab on the card
  const cardH = pad + c.groups.reduce((h, g) => h + labelH + g.files.length * rowH, 0) + groupGap * (c.groups.length - 1);
  const vpad = 20;                              // space between the frame and the content, top and bottom
  const H = cardTop + cardH + 36 + 2 * vpad;
  const bg = kiitBackground(t, W, H);

  const segX = []; { let sx = tx + c.tree[openAt][0] * indent; c.parts.forEach((p) => { segX.push(sx); sx += (p.text.length + 1) * cw; }); }
  const openPx = tx + c.tree[openAt][0] * indent;
  const openW = Math.round(Math.max((c.tree[openAt][1].length + 1) * cw, ...c.parts.map((g, k) => segX[k] - openPx + Math.max(g.text.length * cw, g.label.length * 8))) + 56);
  const kindColor = { root: t.ink, plain: t.dim, item: t.sub, project: t.sub, open: t.blue };
  const px = (i) => tx + c.tree[i][0] * indent;
  const treeText = c.tree.map(([, name, kind], i) => {
    const bold = kind === "item" ? "400" : "700";
    if (kind === "open") {
      const nameSvg = c.parts.map((p) => `<tspan>${esc(p.text)}</tspan>`).join("-");
      return `<rect x="${px(i) - 14}" y="${lineY(i) - 24}" width="${openW}" height="62" rx="10" fill="#FFFFFF" stroke="${t.blue}" stroke-width="2"/>
    <text x="${px(i)}" y="${lineY(i)}" font-size="22" font-weight="700" fill="${t.blue}">${nameSvg}/</text>`;
    }
    return `<text x="${px(i)}" y="${lineY(i)}" font-size="22" font-weight="${bold}" fill="${kindColor[kind]}">${esc(name)}</text>`;
  }).join("\n    ");
  // the format of the open folder's name: a bracket and a label under each part
  let ox = px(openAt);
  const segs = c.parts.map((p) => { const seg = { ...p, x: ox, w: p.text.length * cw }; ox += (p.text.length + 1) * cw; return seg; });
  const brackets = segs.map((g) => `<line x1="${g.x + 2}" y1="${lineY(openAt) + 10}" x2="${g.x + g.w - 2}" y2="${lineY(openAt) + 10}" stroke="${t.border}" stroke-width="2" stroke-linecap="round"/>
    <text x="${g.x}" y="${lineY(openAt) + 28}" font-size="12" fill="${t.dim}">${esc(g.label)}</text>`).join("\n    ");
  // elbows from each folder to its parent
  const parentOf = c.tree.map(([d], i) => { for (let j = i - 1; j >= 0; j--) if (c.tree[j][0] === d - 1) return j; return -1; });
  const lastChild = {};
  parentOf.forEach((pi, i) => { if (pi >= 0) lastChild[pi] = i; });
  const elbows = [
    ...Object.entries(lastChild).map(([pi, ci]) => { const xv = px(+pi) + 8;
      return `<line x1="${xv}" y1="${lineY(+pi) + 8}" x2="${xv}" y2="${lineY(ci) - 8}" stroke="${t.border}" stroke-width="2" stroke-linecap="round"/>`; }),
    ...parentOf.map((pi, i) => pi < 0 ? "" : `<line x1="${px(pi) + 8}" y1="${lineY(i) - 8}" x2="${px(i) - 6}" y2="${lineY(i) - 8}" stroke="${t.border}" stroke-width="2" stroke-linecap="round"/>`),
  ].join("\n    ");
  // a bracket beside rows, with a label
  const noteX = Math.max(tx + 3 * indent + 33 * cw + 40, openPx - 14 + openW + 36);
  const notes = c.notes.map((n) => {
    const y1 = lineY(n.from) - 8, y2 = lineY(n.to) - 8, col = t[n.color] || t.dim;
    const shape = n.from === n.to ? `M ${noteX} ${y1} H ${noteX + 14}` : `M ${noteX} ${y1} H ${noteX + 12} V ${y2} H ${noteX}`;
    return `<path d="${shape}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${noteX + 28}" y="${(y1 + y2) / 2 + 5}" font-size="16" font-weight="700" fill="${col}">${esc(n.label)}</text>`;
  }).join("\n    ");
  const rootIcon = kiitFolderIcon(48, lineY(0) - 23, 0.72);

  let y = cardTop + pad;
  const parts = [];
  c.groups.forEach((g, gi) => {
    if (gi > 0) {
      y += groupGap;
      parts.push(`<line x1="48" y1="${y - 8}" x2="${cardRight}" y2="${y - 8}" stroke="${t.rule}"/>`);
    }
    parts.push(`<text x="72" y="${y + 22}" font-size="13" font-weight="700" fill="${t.dim}" letter-spacing="2">${esc(g.label.toUpperCase())}</text>`);
    y += labelH;
    g.files.forEach((f, fi) => {
      const iconColor = f.color || (f.name.startsWith("_") ? t.dim : t.blue);
      parts.push(fileIcon(72, y + 11, f.icon, iconColor, t));
      parts.push(`<text x="114" y="${y + 34}" font-size="19" font-weight="700" fill="${t.ink}">${esc(f.name)}</text>`);
      parts.push(`<text x="${purposeX}" y="${y + 33}" font-size="16" fill="${t.sub}">${esc(f.purpose)}</text>`);
      // the commands that write it, as chips in one column
      let x = pillsX;
      f.by.forEach((cmd) => {
        const w = chipW(cmd);
        parts.push(`<rect x="${x}" y="${y + 14}" width="${w}" height="28" rx="14" fill="${t.paper}" stroke="${t.border}"/>
    <text x="${x + w / 2}" y="${y + 33}" font-size="14" font-weight="700" fill="${t.blue}" text-anchor="middle">${esc(cmd)}</text>`);
        x += w + 8;
      });
      if (fi < g.files.length - 1) parts.push(`<line x1="72" y1="${y + rowH}" x2="${cardRight - 24}" y2="${y + rowH}" stroke="${t.rule}" stroke-dasharray="3 4"/>`);
      y += rowH;
    });
  });

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.label)}: the workspace holds one folder per change, such as ${esc(folder)}">
  <defs>
    ${bg.defs}
  </defs>

  ${bg.body}

  <g font-family="${KIIT_FONT}" transform="translate(0 ${vpad})">
    <text x="48" y="56" font-size="40" font-weight="700" fill="${t.ink}">${esc(c.label)}</text>
    <text x="48" y="90" font-size="16" fill="${t.dim}">${esc(c.sub)}</text>
    ${rootIcon}
    ${elbows}
    ${treeText}
    ${brackets}
    ${notes}

    <rect x="${cardX}" y="${cardTop - 24}" width="${tabW}" height="40" rx="10" fill="${t.card}" stroke="${t.blue}" stroke-width="1.5"/>
    <rect x="${cardX}" y="${cardTop}" width="${cardRight - cardX}" height="${cardH}" rx="12" fill="${t.card}" stroke="${t.blue}" stroke-width="1.5"/>
    <rect x="${cardX + 1.5}" y="${cardTop - 1.5}" width="${tabW - 3}" height="4" fill="${t.card}"/>
    <text x="${cardX + 20}" y="${cardTop - 4}" font-size="14" font-weight="700" fill="${t.blue}">${esc(tabText)}</text>
    ${parts.join("\n    ")}
  </g>
</svg>
`;
}

kiitMount(buildSvg(CONFIG), "kiit-flow-work-item.svg");
</script>
