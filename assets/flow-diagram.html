<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kiit flow diagram</title>
<!--
  Workflow diagram template (vertical 840 wide, or horizontal 1280x480). Edit CONFIG below, then either:
    1. open this file in a browser and press "Download SVG", or
    2. export from the command line: ./banner.sh flow-diagram.html kiit-flow-diagram.svg
-->
<style>
  body { margin: 0; padding: 24px; background: #eef2f8; color: #1f2937; font: 14px system-ui, sans-serif; }
  #banner svg { width: 100%; max-width: 1280px; height: auto; display: block; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
  pre#svg { display: none; }
</style>
<body>
<div id="banner"></div>
<button id="dl">Download SVG</button>
<pre id="svg"></pre>

<script src="kiit-svg.js"></script>
<script>
// ---- CONFIG: change these for each project ---------------------------------
const CONFIG = {
  layout: "vertical",              // "vertical" or "horizontal"
  captionSize: 17,                 // size of the file names next to each stage
  label: "Workflow",
  stages: [                        // left to right
    { name: "begin",  files: ["01-change.md"] },
    { name: "design", files: ["02-design.md", "03-phases.md", "_status.md"] },
    { name: "review", files: ["04-review.md"] },
    { name: "revise", files: ["02-design.md", "03-phases.md"] },
    { name: "update", files: ["code", "_status.md"] },
    { name: "verify", files: ["lint", "tests", "security", "docs"] },
  ],
  fast: {                          // a path that skips the middle. Set to null to omit
    name: "go",
    label: "one pass: create the work item, implement, check",
    to: 5,                         // index of the stage it joins
  },
  loop: { from: 4, to: 2, label: "repeat until it is right" },
  footerLeft: "also: resume, recent, help",
  footerRight: "after verify: review the code, then revise and update",
  theme: KIIT_THEME,
};
// ---------------------------------------------------------------------------

function buildHorizontal(c) {
  const t = c.theme, W = 1280, H = 480;
  const n = c.stages.length, gap = 40, left = 90;
  const nodeW = Math.floor((W - 2 * left - gap * (n - 1)) / n);
  const top = 205, nodeH = 90, mid = top + nodeH / 2;
  const x = (i) => left + i * (nodeW + gap);
  const cx = (i) => x(i) + nodeW / 2;
  const bg = kiitBackground(t, W, H);

  const nodes = c.stages.map((s, i) => {
    const caption = s.files.map((f, k) =>
      `<text x="${cx(i)}" y="${top + nodeH + 28 + k * 19}" font-size="${Math.min(c.captionSize, 14)}" fill="${t.dim}" text-anchor="middle">${esc(f)}</text>`).join("\n    ");
    return `<rect x="${x(i)}" y="${top}" width="${nodeW}" height="${nodeH}" rx="12" fill="${t.card}" stroke="${t.border}" stroke-width="1.5"/>
    <circle cx="${x(i) + 22}" cy="${top + 22}" r="11" fill="${t.blue}"/>
    <text x="${x(i) + 22}" y="${top + 27}" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">${i + 1}</text>
    <text x="${cx(i)}" y="${mid + 10}" font-size="24" font-weight="700" fill="${t.ink}" text-anchor="middle">${esc(s.name)}</text>
    ${caption}`;
  }).join("\n    ");

  const links = c.stages.slice(0, -1).map((_, i) => {
    const x1 = x(i) + nodeW + 4, x2 = x(i + 1) - 2;
    return `<line x1="${x1}" y1="${mid}" x2="${x2 - 10}" y2="${mid}" stroke="${t.ink}" stroke-width="3"/>
    ${kiitHead(x2, mid, "right", 14, t.ink)}`;
  }).join("\n    ");

  // fast path: from the go node, across the top, down into a later stage
  let fast = "";
  if (c.fast) {
    const fy = 95, end = cx(c.fast.to);
    fast = `<rect x="${left}" y="${fy - 28}" width="${nodeW}" height="56" rx="12" fill="${t.card}" stroke="${t.highlight}" stroke-width="2"/>
    <text x="${left + nodeW / 2}" y="${fy + 8}" font-size="22" font-weight="700" fill="${t.highlight}" text-anchor="middle">${esc(c.fast.name)}</text>
    <path d="M ${left + nodeW + 4} ${fy} H ${end} V ${top - 14}" fill="none" stroke="${t.highlight}" stroke-width="3"/>
    ${kiitHead(end, top - 1, "down", 14, t.highlight)}
    <text x="${(left + nodeW + end) / 2}" y="${fy - 12}" font-size="14" font-weight="700" fill="${t.highlight}" text-anchor="middle">${esc(c.fast.label)}</text>`;
  }

  // loop: from a later stage back to an earlier one, above the row
  let loop = "";
  if (c.loop) {
    const ly = 152, a = cx(c.loop.from), b = cx(c.loop.to);
    loop = `<path d="M ${a} ${top - 2} V ${ly} H ${b} V ${top - 14}" fill="none" stroke="${t.blue}" stroke-width="3" stroke-dasharray="2 0"/>
    ${kiitHead(b, top - 1, "down", 14, t.blue)}
    <text x="${(a + b) / 2}" y="${ly - 12}" font-size="14" font-weight="700" fill="${t.blue}" text-anchor="middle">${esc(c.loop.label)}</text>`;
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.label)}: ${esc(c.stages.map((s) => s.name).join(", "))}">
  <defs>
    ${bg.defs}
  </defs>

  ${bg.body}

  <g font-family="${KIIT_FONT}">
    <text x="${left}" y="46" font-size="26" font-weight="700" fill="${t.ink}">${esc(c.label)}</text>
    ${fast}
    ${loop}
    ${links}
    ${nodes}
    <text x="${left}" y="${H - 36}" font-size="14" fill="${t.dim}">${esc(c.footerLeft)}</text>
    <text x="${W - left}" y="${H - 36}" font-size="14" fill="${t.dim}" text-anchor="end">${esc(c.footerRight)}</text>
  </g>
</svg>
`;
}

function buildVertical(c) {
  const t = c.theme, W = 800;
  const n = c.stages.length;
  const nodeX = 140, nodeW = 540, gap = 36, topPad = 150, filesX = nodeX + 210;
  const size = c.captionSize, step = Math.round(size * 1.4);
  const maxChars = Math.floor((nodeX + nodeW - 20 - filesX) / (size * 0.6));
  const right = nodeX + nodeW, laneX = 100, loopX = right + 32;

  // the files go on one line, comma separated, and wrap only when they are long
  const wrap = (text) => {
    const lines = [];
    let cur = "";
    text.split(" ").forEach((w) => {
      if (cur && (cur + " " + w).length > maxChars) { lines.push(cur); cur = w; }
      else cur = cur ? cur + " " + w : w;
    });
    if (cur) lines.push(cur);
    return lines;
  };
  const rows = c.stages.map((s) => ({ s, lines: wrap(s.files.join(", ")) }));
  const hs = rows.map((r) => Math.max(64, 30 + r.lines.length * step));
  const ys = [];
  hs.reduce((y, h, i) => { ys[i] = y; return y + h + gap; }, topPad);
  const ym = (i) => ys[i] + hs[i] / 2;
  const H = ys[n - 1] + hs[n - 1] + 110;
  const bg = kiitBackground(t, W, H);

  const nodes = rows.map(({ s, lines }, i) => {
    const first = ym(i) + Math.round(size * 0.35) - ((lines.length - 1) * step) / 2;
    const caption = lines.map((l, j) =>
      `<text x="${filesX}" y="${first + j * step}" font-size="${size}" fill="${t.sub}">${esc(l)}</text>`).join("\n    ");
    return `<rect x="${nodeX}" y="${ys[i]}" width="${nodeW}" height="${hs[i]}" rx="12" fill="${t.card}" stroke="${t.border}" stroke-width="1.5"/>
    <circle cx="${nodeX + 32}" cy="${ym(i)}" r="14" fill="${t.blue}"/>
    <text x="${nodeX + 32}" y="${ym(i) + 5}" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">${i + 1}</text>
    <text x="${nodeX + 62}" y="${ym(i) + 9}" font-size="26" font-weight="700" fill="${t.ink}">${esc(s.name)}</text>
    ${caption}`;
  }).join("\n    ");

  const links = c.stages.slice(0, -1).map((_, i) => {
    const x = nodeX + 32, y1 = ys[i] + hs[i] + 3, y2 = ys[i + 1] - 2;
    return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2 - 10}" stroke="${t.ink}" stroke-width="3"/>
    ${kiitHead(x, y2, "down", 14, t.ink)}`;
  }).join("\n    ");

  // fast path: a go box at the top, a lane down the left edge, into a later stage
  let fast = "";
  if (c.fast) {
    const to = ym(c.fast.to);
    fast = `<rect x="${laneX - 50}" y="64" width="100" height="56" rx="12" fill="${t.card}" stroke="${t.highlight}" stroke-width="2"/>
    <text x="${laneX}" y="99" font-size="22" font-weight="700" fill="${t.highlight}" text-anchor="middle">${esc(c.fast.name)}</text>
    <path d="M ${laneX} 124 V ${to} H ${nodeX - 14}" fill="none" stroke="${t.highlight}" stroke-width="3"/>
    ${kiitHead(nodeX - 2, to, "right", 14, t.highlight)}
    <text x="${laneX + 70}" y="98" font-size="14" font-weight="700" fill="${t.highlight}">${esc(c.fast.label)}</text>`;
  }

  // loop: out of a later stage, up the right side, back into an earlier one
  let loop = "";
  if (c.loop) {
    const a = ym(c.loop.from), b = ym(c.loop.to);
    loop = `<path d="M ${right + 3} ${a} H ${loopX} V ${b} H ${right + 16}" fill="none" stroke="${t.blue}" stroke-width="3"/>
    ${kiitHead(right + 3, b, "left", 14, t.blue)}
    <text transform="translate(${loopX + 24} ${(a + b) / 2}) rotate(-90)" font-size="14" font-weight="700" fill="${t.blue}" text-anchor="middle">${esc(c.loop.label)}</text>`;
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.label)}: ${esc(c.stages.map((s) => s.name).join(", "))}">
  <defs>
    ${bg.defs}
  </defs>

  ${bg.body}

  <g font-family="${KIIT_FONT}">
    <text x="60" y="46" font-size="26" font-weight="700" fill="${t.ink}">${esc(c.label)}</text>
    ${fast}
    ${loop}
    ${links}
    ${nodes}
    <text x="60" y="${H - 56}" font-size="14" fill="${t.dim}">${esc(c.footerLeft)}</text>
    <text x="60" y="${H - 32}" font-size="14" fill="${t.dim}">${esc(c.footerRight)}</text>
  </g>
</svg>
`;
}

const buildSvg = (c) => (c.layout === "horizontal" ? buildHorizontal(c) : buildVertical(c));

kiitMount(buildSvg(CONFIG), "kiit-flow-diagram.svg");
</script>
