<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kiit structure</title>
<!--
  Your workspace: kiit.json, the git repos and the _kiit folder, with the skills that use each. 900 wide, to fit a GitHub README. Edit CONFIG below, then either:
    1. open this file in a browser and press "Download SVG", or
    2. export from the command line: ./banner.sh core/structure.html core/structure.svg
  Colours and fonts are theme settings in kiit-svg.js.
-->
<style>
  body { margin: 0; padding: 24px; background: #eef2f8; color: #1f2937; font: 14px system-ui, sans-serif; }
  #banner svg { width: 100%; max-width: 900px; height: auto; display: block; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
  pre#svg { display: none; }
</style>
<body>
<div id="banner"></div>
<button id="dl">Download SVG</button>
<pre id="svg"></pre>

<script src="../kiit-svg.js"></script>
<script>
// ---- CONFIG: change these for each project ---------------------------------
const CONFIG = {
  title: "Structure",
  sub: "your workspace, and the skills that use it",
  tree: [                                    // d is the depth. icon: a name from KIIT_ICONS. blue: the name in the lighter blue
    { d: 0, name: "workspace/", bold: true, icon: "projects", note: "the folder that holds your repos" },
    { d: 1, name: "_kiit/", icon: "projects", note: "created by /kiit:init" },
    { d: 2, name: "flow/", icon: "flow", note: "one folder per skill group" },
    { d: 3, name: "items/", note: "one folder per work item, from begin and go" },
    { d: 3, name: "state.json", note: "the work item you used last" },
    { d: 1, name: ".claude/kiit/kiit.json", icon: "config", blue: true, note: "written by /kiit:init, read by every skill" },
    { d: 1, name: "api/", icon: "repos", note: "a git repo, where vcs-branch and vcs-pr work" },
    { d: 1, name: "app/", icon: "repos", note: "another git repo, listed in projects" },
  ],
  theme: KIIT_THEME,
};
// ---------------------------------------------------------------------------

function buildSvg(c) {
  const t = c.theme, W = t.canvas, m = t.canvasMargin, head = 56, rowH = 50, top1 = 96;
  // the icons in this diagram: [line colour, fill] by kind. Folders are orange, config is the lighter blue
  const style = { projects: [t.accent, "#FFEBDB"], config: [t.brandMid, "none"], repos: [t.brand, t.brandTint] };
  const ico = (name, x, y, size) => { const [c, f] = style[name] || [t.brand, "none"]; return kiitIcon(name, x, y, size, c, 1.75, f); };
  const header = (top, icon, title, sub) => `${kiitIcon(icon, m + 16, top + 14, 28, t.brand)}
    <rect x="${m + 58}" y="${top + 17}" width="3" height="22" rx="1.5" fill="${t.accent}"/>
    ${kiitText("subheading", m + 74, top + 34, title)}
    ${kiitText("caption", m + 74 + kiitTextW(title, KIIT_TYPE.subheading[0]) + 12, top + 34, sub)}`;
  const box = (top, h) => `<rect x="${m}" y="${top}" width="${W - 2 * m}" height="${h}" rx="4" fill="${t.cardFill}" stroke="${t.brandSoft}" stroke-width="1.5"/>`;

  // the workspace tree: a name, and under it what it is. Each level indents one step
  const treeSvg = c.tree.map((r, i) => {
    const x = m + 20 + r.d * 24, cy = top1 + head + 6 + i * rowH + 18;
    const icon = r.icon ? ico(r.icon, x, cy - 13, 22) : "";
    const tx = x + 32;   // every name starts after the icon column, so a row without an icon still indents under its parent
    const name = r.bold || r.blue ? kiitText("strong", tx, cy + 3, r.name, { fill: r.blue ? t.brandMid : t.ink })
                                  : kiitText("body", tx, cy + 3, r.name, { fill: t.ink });
    return `${icon}
    ${name}
    ${kiitText("caption", tx, cy + 22, r.note)}`;
  }).join("\n    ");
  const h1 = head + 6 + c.tree.length * rowH + 8;

  const H = top1 + h1 + 40;
  const bg = kiitBackground(t, W, H);
  const label = `${c.title}: ${c.sub}. The workspace folder holds a _kiit folder made by /kiit:init, the file .claude/kiit/kiit.json, which /kiit:init writes and every skill reads, and your git repos, such as api and app, where the vcs-branch and vcs-pr skills work. Inside _kiit is one folder per skill group, such as flow, which holds an items folder with one folder per work item, made by flow-begin and flow-go, and a state.json file.`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
  <defs>
    ${bg.defs}
  </defs>

  ${bg.body}

  <g font-family="${KIIT_FONT}">
    ${kiitText("heading", m, 52, c.title)}
    ${kiitText("caption", m, 74, c.sub)}

    ${box(top1, h1)}
    ${header(top1, "projects", "Workspace", "the folder you run kiit from")}
    ${treeSvg}
  </g>
</svg>
`;
}

kiitMount(buildSvg(CONFIG), "structure.svg");
</script>
