<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kiit skill groups</title>
<!--
  The skill groups and their commands, one card each. A solid blue chip is in the plugin, and
  a grey chip is still being ported (900 wide, to fit a GitHub README). Edit CONFIG below, then either:
    1. open this file in a browser and press "Download SVG", or
    2. export from the command line: ./banner.sh core/groups.html core/groups.svg
  Colours and fonts are theme settings in kiit-svg.js.
-->
<style>
  body { margin: 0; padding: 24px; background: #eef2f8; color: #1f2937; font: 14px system-ui, sans-serif; }
  #banner svg { width: 100%; max-width: 900px; height: auto; display: block; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
  pre#svg { display: none; }
</style>
<body>
<div id="banner"></div>
<button id="dl">Download SVG</button>
<pre id="svg"></pre>

<script src="../kiit-svg.js"></script>
<script>
// ---- CONFIG: change these for each project ---------------------------------
const CONFIG = {
  title: "Skill groups",
  sub: "run each as /kiit:{group}-{name}, such as /kiit:vcs-branch",
  legend: [["blue", "in the plugin"]],          // add ["soft", "being ported"] and soft commands to show what is not ported yet
  groups: [                                  // in the same order as the README. Each command: [name, style]
    { name: "vcs", icon: "vcs", purpose: "branches and pull requests in your team's format",
      commands: [["branch", "blue"], ["pr", "blue"], ["help", "blue"]] },
    { name: "flow", icon: "flow", purpose: "software development life-cycle skills in three modes",
      commands: [["go", "blue"], ["begin", "blue"], ["help", "blue"]] },
    { name: "core", icon: "core", purpose: "not a skill group: what every group shares",
      commands: [["init", "blue"]] },
    { name: "More skill groups", icon: "more", purpose: "coming soon", soon: true, commands: [] },   // soon: the name and icon in the lighter blue
  ],
  theme: KIIT_THEME,
};
// ---------------------------------------------------------------------------

function buildSvg(c) {
  const t = c.theme, W = 900, m = 40, head = 90, chipH = 28, rowGap = 8, cardGap = 32, top = 124;   // head: the header row of a card
  const innerW = W - 2 * m - 78 - 20;               // the width chips can use inside a card, after the icon column

  // lay out each card: chips in rows, and a new row when the style changes or the row is full
  const cards = [];
  let y = top;
  for (const g of c.groups) {
    const rows = [[]];
    let used = 0;
    for (const [name, style] of g.commands) {
      const w = kiitTextW(name, 14) + 24, row = rows[rows.length - 1];
      const last = row[row.length - 1];
      if (row.length && (last.style !== style || used + 8 + w > innerW)) { rows.push([]); used = 0; }
      const r = rows[rows.length - 1];
      if (r.length) used += 8;
      r.push({ name, style, w });
      used += w;
    }
    const h = g.commands.length ? head + 6 + rows.length * chipH + (rows.length - 1) * rowGap + 20 : 92;   // a group with no commands is just its header
    cards.push({ g, rows, y, h });
    y += h + cardGap;
  }
  const H = y - cardGap + 40;
  const bg = kiitBackground(t, W, H);

  const cardSvg = cards.map(({ g, rows, y, h }) => {
    // a white card. The header is the icon, a short orange bar, then the group name with what it is for below it
        const card = `<rect x="${m}" y="${y}" width="${W - 2 * m}" height="${h}" rx="4" fill="${t.cardFill}" stroke="${t.blueSoft}" stroke-width="1.5"/>
    ${kiitIcon(g.icon, m + 14, y + 26, 32, g.soon ? t.blueMid : t.blue)}
    <rect x="${m + 60}" y="${y + 22}" width="3" height="44" rx="1.5" fill="${t.accent}"/>
    <text x="${m + 78}" y="${y + 38}" font-size="22" font-weight="700" fill="${g.soon ? t.blueMid : t.ink}">${esc(g.name)}</text>`;
    const purpose = `<text x="${m + 78}" y="${y + 66}" font-size="15" fill="${t.sub}">${esc(g.purpose)}</text>`;
    const chips = rows.map((row, ri) => {
      let x = m + 78;
      return row.map((ch) => {
        const chip = kiitChip(t, x, y + head + 6 + ri * (chipH + rowGap), ch.name, ch.style);
        x += chip.w + 8;
        return chip.svg;
      }).join("\n    ");
    }).join("\n    ");
    return `${card}
    ${purpose}
    ${chips}`;
  }).join("\n\n    ");

  // the legend, right aligned on the title line
  let lx = W - m;
  const legend = [...c.legend].reverse().map(([style, text]) => {
    const w = kiitTextW(text, 13) + 24;
    lx -= w;
    const chip = kiitChip(t, lx, 36, text, style, { size: 13, height: 26 });
    lx -= 8;
    return chip.svg;
  }).join("\n    ");

  const label = `${c.title}. ` + c.groups.map((g) => {
    if (!g.commands.length) return `${g.name}: ${g.purpose}.`;
    const done = g.commands.filter((x) => x[1] === "blue").map((x) => x[0]);
    const todo = g.commands.filter((x) => x[1] !== "blue").map((x) => x[0]);
    return `${g.name}: ${done.join(", ")} ${done.length > 1 ? "are" : "is"} in the plugin` + (todo.length ? `, and ${todo.join(", ")} are being ported.` : ".");
  }).join(" ");

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
  <defs>
    ${bg.defs}
  </defs>

  ${bg.body}

  <g font-family="${KIIT_FONT}">
    <text x="${m}" y="62" font-size="32" font-weight="700" fill="${t.ink}">${esc(c.title)}</text>
    <text x="${m}" y="92" font-size="15" fill="${t.sub}">${esc(c.sub)}</text>
    ${legend}

    ${cardSvg}
  </g>
</svg>
`;
}

kiitMount(buildSvg(CONFIG), "groups.svg");
</script>
