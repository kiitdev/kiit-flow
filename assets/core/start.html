<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Kiit start</title>
<!--
  The two setup steps: install the plugin, then run init once from your workspace. 900 wide, to fit a GitHub README. Edit CONFIG below, then either:
    1. open this file in a browser and press "Download SVG", or
    2. export from the command line: ./banner.sh core/start.html core/start.svg
  Colours and fonts are theme settings in kiit-svg.js.
-->
<style>
  body { margin: 0; padding: 24px; background: #eef2f8; color: #1f2937; font: 14px system-ui, sans-serif; }
  #banner svg { width: 100%; max-width: 900px; height: auto; display: block; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; cursor: pointer; }
  pre#svg { display: none; }
</style>
<body>
<div id="banner"></div>
<button id="dl">Download SVG</button>
<pre id="svg"></pre>

<script src="../kiit-svg.js"></script>
<script>
// ---- CONFIG: change these for each project ---------------------------------
const CONFIG = {
  title: "Start",
  sub: "install the plugin, then run init once. Every command needs it first.",
  cards: [                                   // top to bottom. A row is a code line, or a key and text
    { icon: "core", title: "Install", sub: "add the plugin from the marketplace", rows: [
      { code: "/plugin marketplace add kiitdev/kiit" },
      { code: "/plugin install kiit@kiit-dev" },
    ] },
    { icon: "config", title: "Init", sub: "run once, from the folder that holds your repos", rows: [
      { code: "/kiit:init" },
      { key: "reads", text: "each repo, and configures your kiit.json accordingly" },
      { key: "shows", text: "what it would write. Nothing is written until you confirm" },
      { key: "adds", tree: [                  // d is the depth. add: true marks what init creates
        { d: 0, name: "workspace/", icon: "projects" },
        { d: 1, name: "_kiit/", icon: "projects", add: true },
        { d: 1, name: ".claude/kiit/kiit.json", icon: "config", add: true },
        { d: 1, name: "api/", icon: "repos" },
        { d: 1, name: "app/", icon: "repos" },
      ] },
    ] },
  ],
  between: [{ kind: "arrow", note: "then, from your workspace" }],
  theme: KIIT_THEME,
};
// ---------------------------------------------------------------------------

function buildSvg(c) {
  const t = c.theme, W = t.canvas, m = t.canvasMargin, x0 = 72, head = 94, gap = 76, keyW = 64, ex = KIIT_TYPE.example[0];
  const cx = x0 + 24 + keyW, right = W - m - 24;
  // wrap a line to a width in characters, so no text leaves its card
  const wrap = (text, n) => text.split(" ").reduce((ls, w) => {
    if (ls.length && (ls[ls.length - 1] + " " + w).length <= n) ls[ls.length - 1] += " " + w; else ls.push(w);
    return ls;
  }, []);

  let y = 96;
  const parts = [], spots = [];
  c.cards.forEach((card, ci) => {
    const top = y;
    let ry = top + head + 4, body = "";
    for (const r of card.rows) {
      if (r.code) {
        body += `
    <rect x="${x0 + 24}" y="${ry}" width="${right - x0 - 24}" height="36" rx="4" fill="${t.navy}"/>
    ${kiitText("example", x0 + 38, ry + 23, ">", { fill: t.brandSoft, weight: 700 })}
    ${kiitText("example", x0 + 58, ry + 23, r.code, { fill: t.onFill, weight: 700 })}`;   // a terminal line, as in the Examples diagram
        ry += 46;
      } else if (r.tree) {
        // the icons here: folders orange, config the lighter blue, repos blue, as in the Structure diagram
        const style = { projects: [t.accent, "#FFEBDB"], config: [t.brandMid, "none"], repos: [t.brand, t.brandTint] };
        body += `
    ${kiitText("strong", x0 + 24, ry + 18, r.key)}`;
        r.tree.forEach((n, i) => {
          const ty = ry + i * 30, tx = cx + n.d * 24, [lc, lf] = style[n.icon], nw = kiitTextW(n.name, KIIT_TYPE.body[0]);
          body += `
    ${kiitIcon(n.icon, tx, ty, 22, lc, 1.75, lf)}
    ${n.add ? kiitText("strong", tx + 32, ty + 17, n.name, { fill: t.brandMid }) : kiitText("body", tx + 32, ty + 17, n.name, { fill: t.ink })}`;
          if (n.add) body += `
    <circle cx="${tx + 32 + nw + 20}" cy="${ty + 11}" r="9" fill="${t.plus}"/>
    <path d="M${tx + 32 + nw + 20} ${ty + 6}V${ty + 16}M${tx + 32 + nw + 15} ${ty + 11}H${tx + 32 + nw + 25}" stroke="${t.onFill}" stroke-width="2" stroke-linecap="round"/>`;
        });
        ry += r.tree.length * 30 + 4;
      } else {
        const lines = wrap(r.text, 49);
        body += `
    ${kiitText("strong", x0 + 24, ry + 18, r.key)}`;
        lines.forEach((l, i) => { body += `\n    ${kiitText("body", cx, ry + 18 + i * 22, l, { fill: t.ink })}`; });
        ry += 14 + lines.length * 22;
      }
    }
    const h = ry - top + 12;
    parts.push(`<circle cx="${m + 15}" cy="${top + 42}" r="15" fill="${t.brand}"/>
    ${kiitText("strong", m + 15, top + 47.5, String(ci + 1), { fill: t.onFill, anchor: "middle" })}
    <rect x="${x0}" y="${top}" width="${W - m - x0}" height="${h}" rx="4" fill="${t.cardFill}" stroke="${t.brandSoft}" stroke-width="1.5"/>
    ${kiitIcon(card.icon, x0 + 14, top + 26, 32, t.brand)}
    <rect x="${x0 + 56}" y="${top + 22}" width="3" height="44" rx="1.5" fill="${t.accent}"/>
    ${kiitText("cardTitle", x0 + 74, top + 38, card.title)}
    ${kiitText("body", x0 + 74, top + 66, card.sub)}${body}`);
    y = top + h;
    if (ci < c.cards.length - 1) {
      const mid = y + gap / 2, b = c.between[ci], ax = x0 + 44;
      spots.push(`<line x1="${ax}" y1="${y + 20}" x2="${ax}" y2="${y + gap - 36}" stroke="${t.brand}" stroke-width="3"/>
    ${kiitHead(ax, y + gap - 22, "down", 14, t.brand)}
    ${kiitText("body", ax + 24, mid + 5, b.note)}`);
      y += gap;
    }
  });
  const H = y + 40;
  const bg = kiitBackground(t, W, H);
  const label = `${c.title}: ${c.sub} Step 1, install: run /plugin marketplace add kiitdev/kiit, then /plugin install kiit@kiit-dev. Step 2, init: run /kiit:init once from the folder that holds your repos. It reads each repo and configures your kiit.json accordingly, shows what it would write, and writes nothing until you confirm. It then adds .claude/kiit/kiit.json and the _kiit folder to the workspace, next to your repos.`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
  <defs>
    ${bg.defs}
  </defs>

  ${bg.body}

  <g font-family="${KIIT_FONT}">
    ${kiitText("heading", m, 52, c.title)}
    ${kiitText("caption", m, 74, c.sub)}

    ${parts.join("\n\n    ")}

    ${spots.join("\n    ")}
  </g>
</svg>
`;
}

kiitMount(buildSvg(CONFIG), "start.svg");
</script>
