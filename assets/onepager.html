<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>kiit-flow one-pager</title>
<!--
  One page that stacks the banner, the workflow diagram, the first commands, and the work item card.
  Export a PNG with: ./onepager.sh kiit-flow-onepager.png
-->
<style>
  body { margin: 0; padding: 40px; background: #eef2f8; width: max-content;
         display: flex; flex-direction: column; align-items: center; gap: 28px; }
  img { display: block; }
</style>
<body>
<img src="kiit-flow-banner.svg" alt="kiit-flow">
<img src="kiit-flow-diagram.svg" alt="The workflow: Fast, Flow, and Focus">
<img src="kiit-flow-start.svg" alt="The first commands to run, each with a short comment">
<img src="kiit-flow-work-item.svg" alt="A work item folder and its files">
</body>
