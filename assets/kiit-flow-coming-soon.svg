<svg xmlns="http://www.w3.org/2000/svg" width="900" height="954" viewBox="0 0 900 954" role="img" aria-label="Coming soon: Docs (skills). A metadata.json holds a project's facts as structured fields. A standard README.md is generated from it. Diagrams (skills). Architecture kept as structured metadata. Architecture diagrams, and other outputs, are generated from it. Recipes (skills). Grouped recipes for specific tasks. Each takes in standards and patterns to generate code. Standards (resources). Standards you write and control, for databases, API design, and more. Apply them to every project, or to one. Patterns (resources). Established design and architecture patterns to use. Templates (resources). Downloadable templates for apps, APIs, jobs, and more, used to create new apps and components. Extendible (features). People can enhance kiit with extras. The details are still being worked out.">
