<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1004" viewBox="0 0 1040 1004" role="img" aria-label="Workflow: a change takes Fast or Flow, then verify">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C4D8F6" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1040" height="1004" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1040" height="1004" fill="#E8F1FF"/>
    <rect width="1040" height="1004" fill="url(#grid)"/>
    <rect x="0" y="0" width="8" height="1004" fill="#007FFF"/>
  </g>
  <rect x="0.5" y="0.5" width="1039" height="1003" rx="20" fill="none" stroke="#B7CDEE"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="60" y="46" font-size="26" font-weight="700" fill="#111827">Workflow</text>

    <rect x="370" y="64" width="300" height="62" rx="12" fill="#F6FAFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <text x="520" y="92" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">a change</text>
    <text x="520" y="112" font-size="14" fill="#6B7A99" text-anchor="middle">a ticket or a description</text>
    <line x1="520" y1="127" x2="520" y2="176" stroke="#111827" stroke-width="3"/>
    <path d="M 520 176 H 220 V 222" fill="none" stroke="#D9480F" stroke-width="3"/>
    <polygon points="211.6,221 228.4,221 220,235" fill="#D9480F"/>
    <path d="M 520 176 H 708 V 222" fill="none" stroke="#007FFF" stroke-width="3"/>
    <polygon points="699.6,221 716.4,221 708,235" fill="#007FFF"/>

    <rect x="40" y="236" width="360" height="552" rx="16" fill="#FFF3EA" stroke="#F0B896" stroke-width="1.5" stroke-dasharray="7 5"/>
    <circle cx="78" cy="274" r="17" fill="#D9480F"/>
    <text x="78" y="281" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="108" y="282" font-size="30" font-weight="700" fill="#D9480F">Fast</text>
    <text x="64" y="312" font-size="14" fill="#6B7A99">one pass for a small change</text>
    <rect x="60" y="330" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#F0B896" stroke-width="1.5"/>
    <circle cx="82" cy="358" r="6" fill="#D9480F"/>
    <text x="100" y="366" font-size="22" font-weight="700" fill="#111827">go</text>
    <text x="170" y="364" font-size="17" fill="#4B5563">01-change.md, code</text>
    
    <text x="68" y="424" font-size="17" fill="#4B5563"><tspan fill="#D9480F">–</tspan> creates the work item</text>
    <text x="68" y="450" font-size="17" fill="#4B5563"><tspan fill="#D9480F">–</tspan> implements the change</text>
    <text x="68" y="476" font-size="17" fill="#4B5563"><tspan fill="#D9480F">–</tspan> runs the narrowest check</text>
    <text x="64" y="744" font-size="13" fill="#6B7A99">needs a design? go stops and</text>
    <text x="64" y="763" font-size="13" fill="#6B7A99">points to Flow</text>
    <rect x="416" y="236" width="584" height="552" rx="16" fill="#F6FAFF" stroke="#8FB0E3" stroke-width="1.5" stroke-dasharray="7 5"/>
    <circle cx="454" cy="274" r="17" fill="#007FFF"/>
    <text x="454" y="281" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="484" y="282" font-size="30" font-weight="700" fill="#007FFF">Flow</text>
    <text x="440" y="312" font-size="14" fill="#6B7A99">intentional: design first, then review and build</text>
    <rect x="436" y="330" width="488" height="56" rx="10" fill="#FFFFFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <circle cx="458" cy="358" r="6" fill="#007FFF"/>
    <text x="476" y="366" font-size="22" font-weight="700" fill="#111827">begin</text>
    <text x="626" y="364" font-size="17" fill="#4B5563">01-change.md</text>
    <rect x="436" y="420" width="488" height="78" rx="10" fill="#FFFFFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <circle cx="458" cy="459" r="6" fill="#007FFF"/>
    <text x="476" y="467" font-size="22" font-weight="700" fill="#111827">design</text>
    <text x="626" y="453" font-size="17" fill="#4B5563">02-design.md, 03-phases.md,</text>
    <text x="626" y="477" font-size="17" fill="#4B5563">_status.md</text>
    <rect x="436" y="532" width="488" height="56" rx="10" fill="#FFFFFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <circle cx="458" cy="560" r="6" fill="#007FFF"/>
    <text x="476" y="568" font-size="22" font-weight="700" fill="#111827">review</text>
    <text x="626" y="566" font-size="17" fill="#4B5563">04-review.md</text>
    <rect x="436" y="622" width="488" height="56" rx="10" fill="#FFFFFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <circle cx="458" cy="650" r="6" fill="#007FFF"/>
    <text x="476" y="658" font-size="22" font-weight="700" fill="#111827">revise</text>
    <text x="626" y="656" font-size="17" fill="#4B5563">02-design.md, 03-phases.md</text>
    <rect x="436" y="712" width="488" height="56" rx="10" fill="#FFFFFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <circle cx="458" cy="740" r="6" fill="#007FFF"/>
    <text x="476" y="748" font-size="22" font-weight="700" fill="#111827">update</text>
    <text x="626" y="746" font-size="17" fill="#4B5563">code, _status.md</text>
    <line x1="458" y1="387" x2="458" y2="408" stroke="#111827" stroke-width="3"/>
    <polygon points="450.8,407 465.2,407 458,419" fill="#111827"/>
    <line x1="458" y1="499" x2="458" y2="520" stroke="#111827" stroke-width="3"/>
    <polygon points="450.8,519 465.2,519 458,531" fill="#111827"/>
    <line x1="458" y1="589" x2="458" y2="610" stroke="#111827" stroke-width="3"/>
    <polygon points="450.8,609 465.2,609 458,621" fill="#111827"/>
    <line x1="458" y1="679" x2="458" y2="700" stroke="#111827" stroke-width="3"/>
    <polygon points="450.8,699 465.2,699 458,711" fill="#111827"/>
    <path d="M 927 740 H 954 V 560 H 940" fill="none" stroke="#007FFF" stroke-width="3"/>
    <polygon points="941,551.6 941,568.4 927,560" fill="#007FFF"/>
    <text transform="translate(978 650) rotate(-90)" font-size="14" font-weight="700" fill="#007FFF" text-anchor="middle">repeat until it is right</text>

    <path d="M 220 790 V 830" fill="none" stroke="#D9480F" stroke-width="3" stroke-dasharray="6 5"/>
    <polygon points="211.6,829 228.4,829 220,843" fill="#D9480F"/>
    <text x="234" y="820" font-size="13" fill="#D9480F">optional</text>
    <line x1="708" y1="790" x2="708" y2="830" stroke="#007FFF" stroke-width="3"/>
    <polygon points="699.6,829 716.4,829 708,843" fill="#007FFF"/>

    <rect x="140" y="844" width="760" height="60" rx="12" fill="#FFFFFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <circle cx="168" cy="874" r="6" fill="#111827"/>
    <text x="186" y="882" font-size="22" font-weight="700" fill="#111827">verify</text>
    <text x="350" y="880" font-size="17" fill="#4B5563">lint, tests, security, docs</text>

    <text x="60" y="948" font-size="14" fill="#6B7A99">also: resume, recent, help</text>
    <text x="60" y="972" font-size="14" fill="#6B7A99">after verify: review the code, then revise and update</text>
  </g>
</svg>
