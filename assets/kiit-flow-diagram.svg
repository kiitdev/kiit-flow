<svg xmlns="http://www.w3.org/2000/svg" width="1108" height="1104" viewBox="0 0 1108 1104" role="img" aria-label="Workflow: a change takes Fast or Flow, then verify">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C4D8F6" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1108" height="1104" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1108" height="1104" fill="#E8F1FF"/>
    <rect width="1108" height="1104" fill="url(#grid)"/>
  </g>
  <path d="M 20 4 H 1088 A 16 16 0 0 1 1104 20 V 1084 A 16 16 0 0 1 1088 1100 H 20" fill="none" stroke="#4DA3FF" stroke-width="8"/>
  <path d="M 20 4 A 16 16 0 0 0 4 20 V 1084 A 16 16 0 0 0 20 1100" fill="none" stroke="#E8794A" stroke-width="8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" transform="translate(0 20)">
    <text x="60" y="46" font-size="26" font-weight="700" fill="#111827">Workflow</text>

    <rect x="404" y="64" width="300" height="62" rx="12" fill="#F6FAFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <text x="554" y="92" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">a change</text>
    <text x="554" y="112" font-size="14" fill="#6B7A99" text-anchor="middle">a ticket or a description</text>
    <line x1="554" y1="127" x2="554" y2="176" stroke="#111827" stroke-width="3"/>
    <path d="M 554 176 H 220 V 222" fill="none" stroke="#1B8A5A" stroke-width="3"/>
    <polygon points="211.6,221 228.4,221 220,235" fill="#1B8A5A"/>
    <path d="M 554 176 H 742 V 222" fill="none" stroke="#A66F00" stroke-width="3"/>
    <polygon points="733.6,221 750.4,221 742,235" fill="#A66F00"/>

    <rect x="40" y="236" width="360" height="614" rx="16" fill="#EAF7F1" stroke="#8FD1B3" stroke-width="1.5" stroke-dasharray="7 5"/>
    <circle cx="78" cy="274" r="17" fill="#1B8A5A"/>
    <text x="78" y="281" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="108" y="282" font-size="30" font-weight="700" fill="#1B8A5A">Fast</text>
    <text x="64" y="312" font-size="14" fill="#6B7A99">one pass for a clear, low-risk change</text>
    <rect x="60" y="330" width="320" height="58" rx="10" fill="#FFFFFF" stroke="#8FD1B3" stroke-width="1.5"/>
    
    <circle cx="82" cy="359" r="6" fill="#1B8A5A"/>
    <text x="100" y="367" font-size="22" font-weight="700" fill="#111827">go</text>
    <text x="138" y="365" font-size="15" fill="#6B7A99">do it in one pass</text>
    <text x="368" y="407" font-size="13" fill="#6B7A99" text-anchor="end">01-change.md, code</text>
    
    <text x="68" y="438" font-size="15" fill="#4B5563"><tspan fill="#1B8A5A">–</tspan> creates the work item</text>
    <text x="68" y="464" font-size="15" fill="#4B5563"><tspan fill="#1B8A5A">–</tspan> implements the change</text>
    <text x="68" y="490" font-size="15" fill="#4B5563"><tspan fill="#1B8A5A">–</tspan> runs the narrowest check</text>
    <text x="64" y="790" font-size="13" fill="#6B7A99">needs a design, or is risky? go</text>
    <text x="64" y="809" font-size="13" fill="#6B7A99">saves the work item and hands off</text>
    <text x="64" y="828" font-size="13" fill="#6B7A99">to Flow</text>
    <rect x="416" y="236" width="652" height="614" rx="16" fill="#FFF8DC" stroke="#E6C65C" stroke-width="1.5" stroke-dasharray="7 5"/>
    <circle cx="454" cy="274" r="17" fill="#A66F00"/>
    <text x="454" y="281" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="484" y="282" font-size="30" font-weight="700" fill="#A66F00">Flow</text>
    <text x="440" y="312" font-size="14" fill="#6B7A99">intentional: design first, then review and build</text>
    <rect x="492" y="330" width="488" height="58" rx="10" fill="#FFFFFF" stroke="#E6C65C" stroke-width="1.5"/>
    
    <circle cx="514" cy="359" r="6" fill="#A66F00"/>
    <text x="532" y="367" font-size="22" font-weight="700" fill="#111827">begin</text>
    <text x="635" y="365" font-size="15" fill="#6B7A99">create the work item</text>
    <text x="968" y="407" font-size="13" fill="#6B7A99" text-anchor="end">01-change.md</text>
    <rect x="492" y="436" width="488" height="58" rx="10" fill="#FFFFFF" stroke="#E6C65C" stroke-width="1.5"/>
    
    <circle cx="514" cy="465" r="6" fill="#A66F00"/>
    <text x="532" y="473" font-size="22" font-weight="700" fill="#111827">design</text>
    <text x="635" y="471" font-size="15" fill="#6B7A99">plan the change</text>
    <text x="968" y="513" font-size="13" fill="#6B7A99" text-anchor="end">02-design.md, 03-phases.md, _status.md</text>
    <rect x="492" y="542" width="488" height="58" rx="10" fill="#F5F0FF" stroke="#B49CFF" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="902" y="533" width="64" height="18" rx="9" fill="#F5F0FF" stroke="#B49CFF"/>
    <text x="934" y="546" font-size="11" font-weight="700" fill="#7C4DFF" text-anchor="middle">optional</text>
    <circle cx="514" cy="571" r="6" fill="#7C4DFF"/>
    <text x="532" y="579" font-size="22" font-weight="700" fill="#7C4DFF">review</text>
    <text x="635" y="577" font-size="15" fill="#7C4DFF" opacity="0.7">get a second look</text>
    <text x="968" y="619" font-size="13" fill="#6B7A99" text-anchor="end">04-review.md</text>
    <rect x="492" y="648" width="488" height="58" rx="10" fill="#F5F0FF" stroke="#B49CFF" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="902" y="639" width="64" height="18" rx="9" fill="#F5F0FF" stroke="#B49CFF"/>
    <text x="934" y="652" font-size="11" font-weight="700" fill="#7C4DFF" text-anchor="middle">optional</text>
    <circle cx="514" cy="677" r="6" fill="#7C4DFF"/>
    <text x="532" y="685" font-size="22" font-weight="700" fill="#7C4DFF">revise</text>
    <text x="635" y="683" font-size="15" fill="#7C4DFF" opacity="0.7">change the plan</text>
    <text x="968" y="725" font-size="13" fill="#6B7A99" text-anchor="end">02-design.md, 03-phases.md</text>
    <rect x="492" y="754" width="488" height="58" rx="10" fill="#FFFFFF" stroke="#E6C65C" stroke-width="1.5"/>
    
    <circle cx="514" cy="783" r="6" fill="#A66F00"/>
    <text x="532" y="791" font-size="22" font-weight="700" fill="#111827">update</text>
    <text x="635" y="789" font-size="15" fill="#6B7A99">implement the steps</text>
    <text x="968" y="831" font-size="13" fill="#6B7A99" text-anchor="end">code, _status.md</text>
    <line x1="514" y1="389" x2="514" y2="424" stroke="#111827" stroke-width="3"/>
    <polygon points="506.8,423 521.2,423 514,435" fill="#111827"/>
    <line x1="514" y1="495" x2="514" y2="530" stroke="#111827" stroke-width="3"/>
    <polygon points="506.8,529 521.2,529 514,541" fill="#111827"/>
    <line x1="514" y1="601" x2="514" y2="636" stroke="#111827" stroke-width="3"/>
    <polygon points="506.8,635 521.2,635 514,647" fill="#111827"/>
    <line x1="514" y1="707" x2="514" y2="742" stroke="#111827" stroke-width="3"/>
    <polygon points="506.8,741 521.2,741 514,753" fill="#111827"/>
    <path d="M 983 783 H 1010 V 571 H 996" fill="none" stroke="#7C4DFF" stroke-width="3"/>
    <polygon points="997,562.6 997,579.4 983,571" fill="#7C4DFF"/>
    <text transform="translate(1034 677) rotate(-90)" font-size="14" font-weight="700" fill="#7C4DFF" text-anchor="middle">repeat until it is right</text>
    <path d="M 489 465 H 462 V 783 H 476" fill="none" stroke="#A66F00" stroke-width="3"/>
    <polygon points="475,774.6 475,791.4 489,783" fill="#A66F00"/>
    <text transform="translate(450 624) rotate(-90)" font-size="14" font-weight="700" fill="#A66F00" text-anchor="middle">or skip review and revise</text>

    <path d="M 220 852 V 892" fill="none" stroke="#1B8A5A" stroke-width="3" stroke-dasharray="6 5"/>
    <polygon points="211.6,891 228.4,891 220,905" fill="#1B8A5A"/>
    <text x="234" y="882" font-size="13" fill="#1B8A5A">optional</text>
    <line x1="742" y1="852" x2="742" y2="892" stroke="#A66F00" stroke-width="3"/>
    <polygon points="733.6,891 750.4,891 742,905" fill="#A66F00"/>

    <rect x="140" y="906" width="760" height="58" rx="12" fill="#FFFFFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <circle cx="168" cy="935" r="6" fill="#111827"/>
    <text x="186" y="943" font-size="22" font-weight="700" fill="#111827">verify</text>
    <text x="309" y="941" font-size="15" fill="#6B7A99">lint, tests, security, and docs</text>

    <text x="60" y="1008" font-size="14" fill="#6B7A99">also: resume, recent, help</text>
    <text x="60" y="1032" font-size="14" fill="#6B7A99">after verify: review the code, then revise and update</text>
  </g>
</svg>
