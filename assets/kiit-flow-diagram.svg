<svg xmlns="http://www.w3.org/2000/svg" width="1108" height="1044" viewBox="0 0 1108 1044" role="img" aria-label="Workflow: a change takes Fast or Flow, then verify">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C4D8F6" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1108" height="1044" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1108" height="1044" fill="#E8F1FF"/>
    <rect width="1108" height="1044" fill="url(#grid)"/>
  </g>
  <path d="M 20 4 H 1088 A 16 16 0 0 1 1104 20 V 1024 A 16 16 0 0 1 1088 1040 H 20" fill="none" stroke="#4DA3FF" stroke-width="8"/>
  <path d="M 20 4 A 16 16 0 0 0 4 20 V 1024 A 16 16 0 0 0 20 1040" fill="none" stroke="#E8794A" stroke-width="8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" transform="translate(0 20)">
    <text x="60" y="46" font-size="26" font-weight="700" fill="#111827">Workflow</text>

    <rect x="404" y="64" width="300" height="62" rx="12" fill="#F6FAFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <text x="554" y="92" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">a change</text>
    <text x="554" y="112" font-size="14" fill="#6B7A99" text-anchor="middle">a ticket or a description</text>
    <line x1="554" y1="127" x2="554" y2="176" stroke="#111827" stroke-width="3"/>
    <path d="M 554 176 H 220 V 222" fill="none" stroke="#1B8A5A" stroke-width="3"/>
    <polygon points="211.6,221 228.4,221 220,235" fill="#1B8A5A"/>
    <path d="M 554 176 H 742 V 222" fill="none" stroke="#A66F00" stroke-width="3"/>
    <polygon points="733.6,221 750.4,221 742,235" fill="#A66F00"/>

    <rect x="40" y="236" width="360" height="552" rx="16" fill="#EAF7F1" stroke="#8FD1B3" stroke-width="1.5" stroke-dasharray="7 5"/>
    <circle cx="78" cy="274" r="17" fill="#1B8A5A"/>
    <text x="78" y="281" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="108" y="282" font-size="30" font-weight="700" fill="#1B8A5A">Fast</text>
    <text x="64" y="312" font-size="14" fill="#6B7A99">one pass for a clear, low-risk change</text>
    <rect x="60" y="330" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#8FD1B3" stroke-width="1.5"/>
    
    <circle cx="82" cy="358" r="6" fill="#1B8A5A"/>
    <text x="100" y="366" font-size="22" font-weight="700" fill="#111827">go</text>
    <text x="170" y="364" font-size="17" fill="#4B5563">01-change.md, code</text>
    
    <text x="68" y="424" font-size="17" fill="#4B5563"><tspan fill="#1B8A5A">–</tspan> creates the work item</text>
    <text x="68" y="450" font-size="17" fill="#4B5563"><tspan fill="#1B8A5A">–</tspan> implements the change</text>
    <text x="68" y="476" font-size="17" fill="#4B5563"><tspan fill="#1B8A5A">–</tspan> runs the narrowest check</text>
    <text x="64" y="728" font-size="13" fill="#6B7A99">needs a design, or is risky? go</text>
    <text x="64" y="747" font-size="13" fill="#6B7A99">saves the work item and hands off</text>
    <text x="64" y="766" font-size="13" fill="#6B7A99">to Flow</text>
    <rect x="416" y="236" width="652" height="552" rx="16" fill="#FFF8DC" stroke="#E6C65C" stroke-width="1.5" stroke-dasharray="7 5"/>
    <circle cx="454" cy="274" r="17" fill="#A66F00"/>
    <text x="454" y="281" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="484" y="282" font-size="30" font-weight="700" fill="#A66F00">Flow</text>
    <text x="440" y="312" font-size="14" fill="#6B7A99">intentional: design first, then review and build</text>
    <rect x="492" y="330" width="488" height="56" rx="10" fill="#FFFFFF" stroke="#E6C65C" stroke-width="1.5"/>
    
    <circle cx="514" cy="358" r="6" fill="#A66F00"/>
    <text x="532" y="366" font-size="22" font-weight="700" fill="#111827">begin</text>
    <text x="682" y="364" font-size="17" fill="#4B5563">01-change.md</text>
    <rect x="492" y="420" width="488" height="78" rx="10" fill="#FFFFFF" stroke="#E6C65C" stroke-width="1.5"/>
    
    <circle cx="514" cy="459" r="6" fill="#A66F00"/>
    <text x="532" y="467" font-size="22" font-weight="700" fill="#111827">design</text>
    <text x="682" y="453" font-size="17" fill="#4B5563">02-design.md, 03-phases.md,</text>
    <text x="682" y="477" font-size="17" fill="#4B5563">_status.md</text>
    <rect x="492" y="532" width="488" height="56" rx="10" fill="#F5F0FF" stroke="#B49CFF" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="902" y="523" width="64" height="18" rx="9" fill="#F5F0FF" stroke="#B49CFF"/>
    <text x="934" y="536" font-size="11" font-weight="700" fill="#7C4DFF" text-anchor="middle">optional</text>
    <circle cx="514" cy="560" r="6" fill="#7C4DFF"/>
    <text x="532" y="568" font-size="22" font-weight="700" fill="#7C4DFF">review</text>
    <text x="682" y="566" font-size="17" fill="#7C4DFF" opacity="0.8">04-review.md</text>
    <rect x="492" y="622" width="488" height="56" rx="10" fill="#F5F0FF" stroke="#B49CFF" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="902" y="613" width="64" height="18" rx="9" fill="#F5F0FF" stroke="#B49CFF"/>
    <text x="934" y="626" font-size="11" font-weight="700" fill="#7C4DFF" text-anchor="middle">optional</text>
    <circle cx="514" cy="650" r="6" fill="#7C4DFF"/>
    <text x="532" y="658" font-size="22" font-weight="700" fill="#7C4DFF">revise</text>
    <text x="682" y="656" font-size="17" fill="#7C4DFF" opacity="0.8">02-design.md, 03-phases.md</text>
    <rect x="492" y="712" width="488" height="56" rx="10" fill="#FFFFFF" stroke="#E6C65C" stroke-width="1.5"/>
    
    <circle cx="514" cy="740" r="6" fill="#A66F00"/>
    <text x="532" y="748" font-size="22" font-weight="700" fill="#111827">update</text>
    <text x="682" y="746" font-size="17" fill="#4B5563">code, _status.md</text>
    <line x1="514" y1="387" x2="514" y2="408" stroke="#111827" stroke-width="3"/>
    <polygon points="506.8,407 521.2,407 514,419" fill="#111827"/>
    <line x1="514" y1="499" x2="514" y2="520" stroke="#111827" stroke-width="3"/>
    <polygon points="506.8,519 521.2,519 514,531" fill="#111827"/>
    <line x1="514" y1="589" x2="514" y2="610" stroke="#111827" stroke-width="3"/>
    <polygon points="506.8,609 521.2,609 514,621" fill="#111827"/>
    <line x1="514" y1="679" x2="514" y2="700" stroke="#111827" stroke-width="3"/>
    <polygon points="506.8,699 521.2,699 514,711" fill="#111827"/>
    <path d="M 983 740 H 1010 V 560 H 996" fill="none" stroke="#7C4DFF" stroke-width="3"/>
    <polygon points="997,551.6 997,568.4 983,560" fill="#7C4DFF"/>
    <text transform="translate(1034 650) rotate(-90)" font-size="14" font-weight="700" fill="#7C4DFF" text-anchor="middle">repeat until it is right</text>
    <path d="M 489 459 H 462 V 740 H 476" fill="none" stroke="#A66F00" stroke-width="3"/>
    <polygon points="475,731.6 475,748.4 489,740" fill="#A66F00"/>
    <text transform="translate(450 599.5) rotate(-90)" font-size="14" font-weight="700" fill="#A66F00" text-anchor="middle">or skip review and revise</text>

    <path d="M 220 790 V 830" fill="none" stroke="#1B8A5A" stroke-width="3" stroke-dasharray="6 5"/>
    <polygon points="211.6,829 228.4,829 220,843" fill="#1B8A5A"/>
    <text x="234" y="820" font-size="13" fill="#1B8A5A">optional</text>
    <line x1="742" y1="790" x2="742" y2="830" stroke="#A66F00" stroke-width="3"/>
    <polygon points="733.6,829 750.4,829 742,843" fill="#A66F00"/>

    <rect x="140" y="844" width="760" height="60" rx="12" fill="#FFFFFF" stroke="#8FB0E3" stroke-width="1.5"/>
    <circle cx="168" cy="874" r="6" fill="#111827"/>
    <text x="186" y="882" font-size="22" font-weight="700" fill="#111827">verify</text>
    <text x="350" y="880" font-size="17" fill="#4B5563">lint, tests, security, docs</text>

    <text x="60" y="948" font-size="14" fill="#6B7A99">also: resume, recent, help</text>
    <text x="60" y="972" font-size="14" fill="#6B7A99">after verify: review the code, then revise and update</text>
  </g>
</svg>
